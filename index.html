
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#111318">
<title>マイメニュー</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:25px 18px 40px;background:#111318;color:#fff;font-family:-apple-system,BlinkMacSystemFont,sans-serif}body.light-theme{background:#f2f2f7;color:#1c1c1e;color-scheme:light}h1{font-size:25px;margin:10px 0 8px}.subtitle{color:#999;font-size:13px;margin-bottom:25px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px 14px;align-items:start}.item{display:flex;flex-direction:column;align-items:center;min-width:0;text-decoration:none;color:inherit;text-align:center;-webkit-tap-highlight-color:transparent}.icon{display:flex;align-items:center;justify-content:center;width:100%;aspect-ratio:1;border-radius:23%;overflow:hidden;background:#292d36;font-size:43px}.icon img{display:block;width:100%;height:100%;object-fit:cover;border:0}.name{display:block;width:100%;margin-top:8px;font-size:12px;overflow-wrap:anywhere}.hide-names .name{display:none!important}.small-icons .icon{width:68%;font-size:30px}.large-icons .icon{width:100%;font-size:48px}button,input,select{font:inherit}button{border:0;border-radius:10px;padding:12px 15px;background:#303541;color:white;cursor:pointer}.light-theme button{background:#dedee5;color:#1c1c1e}.primary{background:#3478f6!important;color:#fff!important;width:100%}.manage-button{width:100%;margin-top:30px;background:#292d36}#manager{display:none}.panel{background:#20242d;border-radius:14px;padding:15px;margin:15px 0}.light-theme .panel,.light-theme .manage-item{background:#fff}.field{display:block;margin:14px 0}.field label{display:block;color:#bbb;font-size:13px;margin-bottom:7px}.field input,.field select{width:100%;padding:12px;border:1px solid #454b58;border-radius:9px;background:#151820;color:white}.light-theme .field input,.light-theme .field select{background:#f7f7fa;color:#1c1c1e;border-color:#c8c8d0}.preview{width:82px;height:82px;border-radius:18px;background:#303541;display:flex;align-items:center;justify-content:center;font-size:38px;overflow:hidden;margin-top:10px}.preview img{display:block;width:100%;height:100%;object-fit:cover}.manage-item{display:flex;align-items:center;gap:10px;background:#292d36;border-radius:12px;padding:10px;margin:9px 0}.manage-item img,.manage-item .emoji{flex:0 0 48px;width:48px;height:48px;object-fit:cover;border-radius:11px}.manage-item .emoji{display:grid;place-items:center;background:#3a404c;font-size:27px}.manage-item .info{flex:1;min-width:0;overflow-wrap:anywhere}.manage-item small{color:#aaa}.actions{display:flex;flex-direction:column;gap:5px}.actions button{padding:7px 10px;font-size:12px}.delete{background:#9e343c!important;color:#fff!important}.hidden{display:none!important}.note{color:#aaa;font-size:12px;line-height:1.6}.setting-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:14px 0;font-size:14px}.setting-row select{max-width:150px;padding:8px;border-radius:8px}.setting-row input{width:22px;height:22px}
</style>
</head>
<body>
<div id="main"><h1>マイメニュー</h1><div class="subtitle">よく使う操作を選択してください</div><div class="grid" id="menu"></div><button class="manage-button" onclick="showManager()">⚙️ メニュー管理</button></div>
<div id="manager">
<h1>メニュー管理</h1><div class="subtitle">アイコンの追加・編集・削除・並び替え</div><button class="primary" onclick="newItem()">＋ 新しい項目を追加</button>
<div class="panel"><h3>表示設定</h3>
<div class="setting-row"><label for="showNames">アイコン名を表示</label><input id="showNames" type="checkbox" onchange="changeSetting('showNames',this.checked)"></div>
<div class="setting-row"><label for="columns">列数</label><select id="columns" onchange="changeSetting('columns',Number(this.value))"><option value="2">2列</option><option value="3">3列</option><option value="4">4列</option></select></div>
<div class="setting-row"><label for="iconSize">アイコンサイズ</label><select id="iconSize" onchange="changeSetting('iconSize',this.value)"><option value="small">小</option><option value="medium">標準</option><option value="large">大</option></select></div>
<div class="setting-row"><label for="theme">テーマ</label><select id="theme" onchange="changeSetting('theme',this.value)"><option value="dark">ダーク</option><option value="light">ライト</option></select></div></div>
<div class="panel"><h3>バックアップ・復元</h3><button class="primary" onclick="backupMenu()">📥 バックアップを保存</button><button onclick="document.getElementById('backupFile').click()" style="width:100%;margin-top:10px">📤 バックアップから復元</button><input id="backupFile" type="file" accept=".json,application/json" style="display:none" onchange="restoreMenu(event)"><p class="note">登録項目・並び順・アイコン画像・表示設定を保存します。復元すると現在の内容は上書きされます。</p></div>
<div id="editor" class="panel hidden"><h3 id="editorTitle">新しい項目</h3><div class="field"><label for="itemName">表示名（管理画面用）</label><input id="itemName" placeholder="例：Googleカレンダー"></div><div class="field"><label for="itemImage">アイコン画像</label><input id="itemImage" type="file" accept="image/*"><div class="note">画像は正方形に縮小して保存します。</div><div class="preview" id="preview">📱</div><button onclick="clearImage()" style="margin-top:8px">画像を解除</button></div><div class="field"><label for="itemEmoji">絵文字（画像がない場合）</label><input id="itemEmoji" value="📱" maxlength="8"></div><div class="field"><label for="itemType">起動方法</label><select id="itemType" onchange="updateTargetLabel()"><option value="url">アプリ・Webサイトを直接開く</option><option value="shortcut">ショートカットを実行</option></select></div><div class="field"><label id="targetLabel" for="itemTarget">起動URL</label><input id="itemTarget" placeholder="https://example.com"></div><button class="primary" onclick="saveItem()">保存する</button><button onclick="cancelEdit()" style="width:100%;margin-top:8px">キャンセル</button></div>
<h3>登録済み項目</h3><div id="manageList"></div><button onclick="hideManager()" style="width:100%;margin-top:20px">← メニューに戻る</button><p class="note">登録内容はこのiPhoneのWebアプリ内に保存されます。Webサイトのデータを削除すると失われる場合があります。</p>
</div>
<script>
'use strict';
const defaultItems=[
{name:'アラーム',emoji:'⏰',image:'',type:'shortcut',target:'アラーム設定'},
{name:'カレンダー',emoji:'📅',image:'',type:'shortcut',target:'カレンダー起動'},
{name:'ライト',emoji:'🔦',image:'',type:'shortcut',target:'ライト切替'},
{name:'バッテリー',emoji:'🔋',image:'',type:'shortcut',target:'バッテリー確認'},
{name:'ゲーム',emoji:'🎮',image:'',type:'shortcut',target:'ゲームメニュー'},
{name:'設定',emoji:'⚙️',image:'',type:'shortcut',target:'設定メニュー'},
{name:'d払い',emoji:'💳',image:'icons/dbarai.png',type:'url',target:'https://rpapl.aif.pub.cilite.docomo.ne.jp/dpay_app'}
];
// 既存の保存データを引き継ぐため、保存キーは変更していません。
const STORAGE_KEY='myMenuItems_v1',SETTINGS_KEY='myMenuSettings_v1';
let items=[],settings={showNames:false,columns:3,iconSize:'medium',theme:'dark'},editingIndex=-1,selectedImage='';
try{const s=localStorage.getItem(STORAGE_KEY);items=s?JSON.parse(s):defaultItems;if(!Array.isArray(items))throw Error('bad items')}catch(e){items=defaultItems}
try{const s=localStorage.getItem(SETTINGS_KEY);if(s)settings={...settings,...JSON.parse(s)}}catch(e){console.warn(e)}
function saveData(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(items));return true}catch(e){alert('保存できませんでした。画像の容量が大きい可能性があります。');return false}}
function saveSettings(){try{localStorage.setItem(SETTINGS_KEY,JSON.stringify(settings));return true}catch(e){alert('設定を保存できませんでした。');return false}}
function applySettings(){document.getElementById('menu').style.gridTemplateColumns=`repeat(${settings.columns},minmax(0,1fr))`;document.body.classList.toggle('hide-names',!settings.showNames);document.body.classList.toggle('small-icons',settings.iconSize==='small');document.body.classList.toggle('large-icons',settings.iconSize==='large');document.body.classList.toggle('light-theme',settings.theme==='light')}
function syncSettings(){showNames.checked=!!settings.showNames;columns.value=String(settings.columns);iconSize.value=settings.iconSize;theme.value=settings.theme}
function changeSetting(k,v){const old={...settings};settings[k]=v;if(saveSettings())applySettings();else{settings=old;syncSettings();applySettings()}}
function renderMenu(){const menu=document.getElementById('menu');menu.innerHTML='';menu.style.gridTemplateColumns=`repeat(${settings.columns},minmax(0,1fr))`;items.forEach(item=>{const a=document.createElement('a');a.className='item';const box=document.createElement('div');box.className='icon';if(item.image){const img=document.createElement('img');img.src=item.image;img.alt=item.name||'';img.onerror=()=>{img.remove();box.textContent=item.emoji||'📱'};box.appendChild(img)}else box.textContent=item.emoji||'📱';const label=document.createElement('span');label.className='name';label.textContent=item.name||'';a.append(box,label);if(item.type==='shortcut')a.href='shortcuts://run-shortcut?name='+encodeURIComponent(item.target);else if(item.type==='url')a.href=item.target;else a.href='#';menu.appendChild(a)})}
function showManager(){main.style.display='none';manager.style.display='block';syncSettings();renderManageList()}
function hideManager(){manager.style.display='none';main.style.display='block';renderMenu()}
function emojiBox(value){const d=document.createElement('div');d.className='emoji';d.textContent=value||'📱';return d}
function renderManageList(){const list=document.getElementById('manageList');list.innerHTML='';items.forEach((item,i)=>{const row=document.createElement('div');row.className='manage-item';if(item.image){const img=document.createElement('img');img.src=item.image;img.alt='';img.onerror=()=>img.replaceWith(emojiBox(item.emoji));row.appendChild(img)}else row.appendChild(emojiBox(item.emoji));const info=document.createElement('div');info.className='info';const title=document.createElement('strong');title.textContent=item.name;const small=document.createElement('small');small.textContent=item.type==='shortcut'?'ショートカット':'URL・アプリ';info.append(title,document.createElement('br'),small);const actions=document.createElement('div');actions.className='actions';[['↑',()=>moveItem(i,-1),i===0],['↓',()=>moveItem(i,1),i===items.length-1],['編集',()=>editItem(i),false],['削除',()=>deleteItem(i),false]].forEach(([t,fn,disabled])=>{const b=document.createElement('button');b.textContent=t;b.disabled=disabled;b.onclick=fn;if(t==='削除')b.className='delete';actions.appendChild(b)});row.append(info,actions);list.appendChild(row)})}
function newItem(){editingIndex=-1;selectedImage='';editorTitle.textContent='新しい項目';itemName.value='';itemEmoji.value='📱';itemType.value='url';itemTarget.value='';itemImage.value='';updateTargetLabel();updatePreview();editor.classList.remove('hidden')}
function editItem(i){const x=items[i];editingIndex=i;selectedImage=x.image||'';editorTitle.textContent='項目を編集';itemName.value=x.name||'';itemEmoji.value=x.emoji||'📱';itemType.value=x.type;itemTarget.value=x.target||'';itemImage.value='';updateTargetLabel();updatePreview();editor.classList.remove('hidden')}
function cancelEdit(){editor.classList.add('hidden')}
function updateTargetLabel(){const sh=itemType.value==='shortcut';targetLabel.textContent=sh?'実行するショートカット名':'起動URL';itemTarget.placeholder=sh?'例：アラーム設定':'https://example.com'}
function updatePreview(){preview.innerHTML='';if(selectedImage){const img=document.createElement('img');img.src=selectedImage;img.onerror=()=>{preview.textContent=itemEmoji.value||'📱'};preview.appendChild(img)}else preview.textContent=itemEmoji.value||'📱'}
itemEmoji.addEventListener('input',updatePreview);
function clearImage(){selectedImage='';itemImage.value='';updatePreview()}
itemImage.addEventListener('change',function(){const file=this.files&&this.files[0];if(!file)return;if(!file.type.startsWith('image/')){alert('画像ファイルを選択してください。');this.value='';return}const reader=new FileReader();reader.onload=e=>{const im=new Image();im.onload=()=>{const size=256,c=document.createElement('canvas');c.width=size;c.height=size;const ctx=c.getContext('2d'),scale=Math.max(size/im.width,size/im.height),w=im.width*scale,h=im.height*scale;ctx.drawImage(im,(size-w)/2,(size-h)/2,w,h);selectedImage=c.toDataURL('image/jpeg',.88);updatePreview()};im.onerror=()=>alert('画像を読み込めませんでした。');im.src=e.target.result};reader.readAsDataURL(file)});
function saveItem(){const name=itemName.value.trim(),type=itemType.value,target=itemTarget.value.trim(),emoji=itemEmoji.value.trim()||'📱';if(!name||!target){alert('表示名と起動先を入力してください。');return}if(type==='url'&&!/^(https?:\/\/|shortcuts:\/\/)/i.test(target)){alert('URLを正しく入力してください。');return}const old=items.slice(),obj={name,emoji,image:selectedImage,type,target};if(editingIndex>=0)items[editingIndex]=obj;else items.push(obj);if(saveData()){editor.classList.add('hidden');renderManageList();renderMenu();alert('保存しました。')}else items=old}
function deleteItem(i){if(!confirm('「'+items[i].name+'」を削除しますか？'))return;const old=items.slice();items.splice(i,1);if(saveData()){renderManageList();renderMenu()}else items=old}
function moveItem(i,d){const n=i+d;if(n<0||n>=items.length)return;const old=items.slice();[items[i],items[n]]=[items[n],items[i]];if(saveData()){renderManageList();renderMenu()}else items=old}
function backupMenu(){const data={app:'myMenu',version:1,createdAt:new Date().toISOString(),items,settings};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='my-menu-backup-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);alert('バックアップファイルを作成しました。')}
function restoreMenu(event){const file=event.target.files&&event.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const b=JSON.parse(reader.result);if(b.app!=='myMenu'||b.version!==1||!Array.isArray(b.items))throw Error('backup');const ok=b.items.every(x=>x&&typeof x.name==='string'&&typeof x.emoji==='string'&&typeof x.image==='string'&&['url','shortcut'].includes(x.type)&&typeof x.target==='string');if(!ok)throw Error('items');if(!confirm('現在のメニューと表示設定をバックアップ内容で上書きします。\nよろしいですか？'))return;const oldI=items,oldS=settings;items=b.items;if(b.settings&&typeof b.settings==='object')settings={...settings,...b.settings};if(saveData()&&saveSettings()){applySettings();syncSettings();renderManageList();renderMenu();alert('バックアップから復元しました。')}else{items=oldI;settings=oldS;saveData();saveSettings();applySettings();syncSettings()}}catch(e){alert('バックアップファイルを読み込めませんでした。')}finally{event.target.value=''}};reader.readAsText(file)}
applySettings();renderMenu();
</script>
</body>
</html>
