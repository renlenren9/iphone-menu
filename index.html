
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#111318">
<title>マイメニュー</title>
  
<style>

/* カスタマイズ設定 */
body.light-theme {
  background: #f2f2f7;
  color: #1c1c1e;
}

body.light-theme .item {
  color: #1c1c1e;
}

body.light-theme .panel,
body.light-theme .manager-item {
  background: #ffffff;
  color: #1c1c1e;
}

body.small-icons .icon {
  width: 54px;
  height: 54px;
  font-size: 27px;
}

body.large-icons .icon {
  width: 88px;
  height: 88px;
  font-size: 44px;
}

body.small-icons .name {
  font-size: 11px;
}

body.large-icons .name {
  font-size: 16px;
}
  
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 25px 18px;
  background: #111318;
  color: white;
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
}

h1 { font-size: 25px; margin: 10px 0 8px; }
.subtitle { color: #999; font-size: 13px; margin-bottom: 25px; }

.grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 22px 14px;
}

.item {
  text-decoration: none;
  color: white;
  text-align: center;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  min-width: 0;
}

.icon {
  width: 100%;
  aspect-ratio: 1;
  border-radius: 23%;
  background: #292d36;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  font-size: 43px;
}

.icon img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.name {
  display: block;
  font-size: 12px;
  margin-top: 8px;
  overflow-wrap: anywhere;
}

button, input, select {
  font: inherit;
}

button {
  border: 0;
  border-radius: 10px;
  padding: 12px 15px;
  background: #303541;
  color: white;
  cursor: pointer;
}

.primary {
  background: #3478f6;
  width: 100%;
}

.manage-button {
  width: 100%;
  margin-top: 30px;
  background: #292d36;
}

#manager { display: none; }

.panel {
  background: #20242d;
  border-radius: 14px;
  padding: 15px;
  margin: 15px 0;
}

.field {
  display: block;
  margin: 14px 0;
}

.field label {
  display: block;
  color: #bbb;
  font-size: 13px;
  margin-bottom: 7px;
}

.field input, .field select {
  width: 100%;
  padding: 12px;
  border: 1px solid #454b58;
  border-radius: 9px;
  background: #151820;
  color: white;
}

.preview {
  width: 82px;
  height: 82px;
  border-radius: 18px;
  background: #303541;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 38px;
  overflow: hidden;
  margin-top: 10px;
}

.preview img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.manage-item {
  display: flex;
  align-items: center;
  gap: 10px;
  background: #292d36;
  border-radius: 12px;
  padding: 10px;
  margin: 9px 0;
}

.manage-item img {
  width: 48px;
  height: 48px;
  object-fit: cover;
  border-radius: 11px;
}

.manage-item .emoji {
  width: 48px;
  height: 48px;
  display: grid;
  place-items: center;
  background: #3a404c;
  border-radius: 11px;
  font-size: 27px;
}

.manage-item .info {
  flex: 1;
  min-width: 0;
  overflow-wrap: anywhere;
}

.manage-item small {
  color: #aaa;
}

.actions {
  display: flex;
  flex-direction: column;
  gap: 5px;
}

.actions button {
  padding: 7px 10px;
  font-size: 12px;
}

.delete { background: #9e343c; }

.hidden { display: none !important; }

.note {
  color: #aaa;
  font-size: 12px;
  line-height: 1.6;
}

</style>
</head>

<body>

<div id="main">
  <h1>マイメニュー</h1>
  <div class="subtitle">よく使う操作を選択してください</div>
  <div class="grid" id="menu"></div>
  <button class="manage-button" onclick="showManager()">
    ⚙️ メニュー管理
  </button>
</div>

<div id="manager">
  <h1>メニュー管理</h1>
  <div class="subtitle">アイコンの追加・編集・削除・並び替え</div>

  <button class="primary" onclick="newItem()">＋ 新しい項目を追加</button>

  <button
  onclick="showSettings()"
  style="width:100%;margin-top:10px"
>
  ⚙️ 表示・デザイン設定
</button>

<div id="settingsPanel" class="panel hidden">
  <h3>表示・デザイン設定</h3>

  <div class="field">
    <label>アイコン名</label>
    <select id="settingLabels">
      <option value="show">表示</option>
      <option value="hide">非表示</option>
    </select>
  </div>

  <div class="field">
    <label>グリッド列数</label>
    <select id="settingColumns">
      <option value="2">2列</option>
      <option value="3">3列</option>
      <option value="4">4列</option>
      <option value="5">5列</option>
    </select>
  </div>

  <div class="field">
    <label>アイコンサイズ</label>
    <select id="settingSize">
      <option value="small">小</option>
      <option value="medium">標準</option>
      <option value="large">大</option>
    </select>
  </div>

  <div class="field">
    <label>テーマ</label>
    <select id="settingTheme">
      <option value="dark">ダーク</option>
      <option value="light">ライト</option>
    </select>
  </div>

  <button class="primary" onclick="saveSettings()">
    設定を保存
  </button>
  </div>
 
  <div class="panel">
  <h3>バックアップ・復元</h3>

  <button class="primary" onclick="backupMenu()">
    📥 バックアップを保存
  </button>

  <button onclick="document.getElementById('backupFile').click()"
          style="width:100%;margin-top:10px">
    📤 バックアップから復元
  </button>

  <input
    id="backupFile"
    type="file"
    accept=".json,application/json"
    style="display:none"
    onchange="restoreMenu(event)"
  >

  <p class="note">
    登録項目・並び順・アイコン画像を保存します。
    復元すると現在のメニュー内容は上書きされます。
  </p>
  </div>
  
  <div id="editor" class="panel hidden">
    <h3 id="editorTitle">新しい項目</h3>

    <div class="field">
      <label>表示名</label>
      <input id="itemName" placeholder="例：Googleカレンダー">
    </div>

    <div class="field">
      <label>アイコン画像</label>
      <input id="itemImage" type="file" accept="image/*">
      <div class="note">写真やファイルから画像を選択できます。画像は縮小して保存します。</div>
      <div class="preview" id="preview">📱</div>
      <button onclick="clearImage()" style="margin-top:8px">画像を解除</button>
    </div>

    <div class="field">
      <label>絵文字（画像がない場合）</label>
      <input id="itemEmoji" value="📱" maxlength="8">
    </div>

    <div class="field">
      <label>起動方法</label>
      <select id="itemType" onchange="updateTargetLabel()">
        <option value="url">アプリ・Webサイトを直接開く</option>
        <option value="shortcut">ショートカットを実行</option>
      </select>
    </div>

    <div class="field">
      <label id="targetLabel">起動URL</label>
      <input id="itemTarget" placeholder="https://example.com">
    </div>

    <button class="primary" onclick="saveItem()">保存する</button>
    <button onclick="cancelEdit()" style="width:100%;margin-top:8px">キャンセル</button>
  </div>

  <h3>登録済み項目</h3>
  <div id="manageList"></div>

  <button onclick="hideManager()" style="width:100%;margin-top:20px">
    ← メニューに戻る
  </button>

  <p class="note">
    登録内容はこのiPhoneのWebアプリ内に保存されます。
    Webサイトのデータを削除すると失われる場合があります。
  </p>
</div>

<script>

// ==================================
// 初期登録データ
// ==================================

const defaultItems = [
  {name:"アラーム",emoji:"⏰",image:"",type:"shortcut",target:"アラーム設定"},
  {name:"カレンダー",emoji:"📅",image:"",type:"shortcut",target:"カレンダー起動"},
  {name:"ライト",emoji:"🔦",image:"",type:"shortcut",target:"ライト切替"},
  {name:"バッテリー",emoji:"🔋",image:"",type:"shortcut",target:"バッテリー確認"},
  {name:"ゲーム",emoji:"🎮",image:"",type:"shortcut",target:"ゲームメニュー"},
  {name:"設定",emoji:"⚙️",image:"",type:"shortcut",target:"設定メニュー"},
  {
    name:"d払い",
    emoji:"💳",
    image:"icons/dbarai.png",
    type:"url",
    target:"https://rpapl.aif.pub.cilite.docomo.ne.jp/dpay_app"
  }
];

const STORAGE_KEY = "myMenuItems_v1";

const SETTINGS_KEY = "myMenuSettings_v1";

let settings = {
  showNames: true,
  columns: 3,
  iconSize: "medium",
  theme: "dark"
};

try {
  const savedSettings = localStorage.getItem(SETTINGS_KEY);
  if (savedSettings) {
    settings = { ...settings, ...JSON.parse(savedSettings) };
  }
} catch(e) {
  console.log("設定の読み込みに失敗しました");
}
  
let items = [];
let editingIndex = -1;
let selectedImage = "";
let originalImage = "";

try {
  const saved = localStorage.getItem(STORAGE_KEY);
  items = saved ? JSON.parse(saved) : defaultItems;
  if (!Array.isArray(items)) throw new Error("invalid data");
} catch(e) {
  items = defaultItems;
}


function showSettings() {
  const panel = document.getElementById("settingsPanel");

  document.getElementById("settingLabels").value =
    settings.showNames ? "show" : "hide";

  document.getElementById("settingColumns").value =
    String(settings.columns);

  document.getElementById("settingSize").value =
    settings.iconSize;

  document.getElementById("settingTheme").value =
    settings.theme;

  panel.classList.toggle("hidden");
}

function saveSettings() {
  settings.showNames =
    document.getElementById("settingLabels").value === "show";

  settings.columns =
    Number(document.getElementById("settingColumns").value);

  settings.iconSize =
    document.getElementById("settingSize").value;

  settings.theme =
    document.getElementById("settingTheme").value;

  try {
    localStorage.setItem(
      SETTINGS_KEY,
      JSON.stringify(settings)
    );
  } catch (e) {
    alert("設定を保存できませんでした。");
    return;
  }

  applySettings();
  renderMenu();

  document.getElementById("settingsPanel").classList.add("hidden");

  alert("設定を保存しました。");
}

function applySettings() {
  const menu = document.getElementById("menu");

  menu.style.gridTemplateColumns =
    `repeat(${settings.columns}, minmax(0, 1fr))`;

  document.body.classList.toggle(
    "light-theme",
    settings.theme === "light"
  );

  document.body.classList.toggle(
    "small-icons",
    settings.iconSize === "small"
  );

  document.body.classList.toggle(
    "large-icons",
    settings.iconSize === "large"
  );
}
  
function saveData() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
    return true;
  } catch(e) {
    alert("保存できませんでした。画像の容量が大きい可能性があります。");
    return false;
  }
}

// ==================================
// バックアップ・復元
// ==================================

function backupMenu() {
  const backup = {
    app: "myMenu",
    version: 1,
    createdAt: new Date().toISOString(),
    items: items,
    settings: settings
  };

  const blob = new Blob(
    [JSON.stringify(backup, null, 2)],
    { type: "application/json" }
  );

  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");

  const date = new Date().toISOString().slice(0, 10);

  link.href = url;
  link.download = "my-menu-backup-" + date + ".json";

  document.body.appendChild(link);
  link.click();
  link.remove();

  setTimeout(() => URL.revokeObjectURL(url), 1000);

  alert("バックアップファイルを作成しました。");
}

function restoreMenu(event) {
  const file = event.target.files[0];
  if (!file) return;

  const reader = new FileReader();

  reader.onload = function() {
    try {
      const backup = JSON.parse(reader.result);

      if (
        backup.app !== "myMenu" ||
        backup.version !== 1 ||
        !Array.isArray(backup.items)
      ) {
        throw new Error("invalid backup");
      }

      const valid = backup.items.every(item =>
        item &&
        typeof item.name === "string" &&
        typeof item.emoji === "string" &&
        typeof item.image === "string" &&
        ["url", "shortcut"].includes(item.type) &&
        typeof item.target === "string"
      );

      if (!valid) {
        throw new Error("invalid items");
      }

      if (!confirm(
        "現在のメニューをバックアップの内容で上書きします。\nよろしいですか？"
      )) {
        return;
      }

      const oldItems = items;
      items = backup.items;

      const oldSettings = settings;

      if (backup.settings && typeof backup.settings === "object") {
      settings = { ...settings, ...backup.settings };
      }
      
      if (saveData()) {
        localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings));
        applySettings();
        renderManageList();
        renderMenu();
        alert("バックアップから復元しました。");
      } else {
      items = oldItems;
      settings = oldSettings;
      localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings));
      applySettings();
      }

    } catch(e) {
      alert("バックアップファイルを読み込めませんでした。");
    } finally {
      event.target.value = "";
    }
  };

  reader.readAsText(file);
}

// ==================================
// メニュー表示
// ==================================

function renderMenu() {
  const menu = document.getElementById("menu");
  menu.innerHTML = "";

  items.forEach(item => {
    const link = document.createElement("a");
    link.className = "item";

    const icon = document.createElement("div");
    icon.className = "icon";

    if (item.image) {
      const img = document.createElement("img");
      img.src = item.image;
      img.alt = item.name;
      img.onerror = () => {
        icon.textContent = item.emoji || "📱";
      };
      icon.appendChild(img);
    } else {
      icon.textContent = item.emoji || "📱";
    }

    const name = document.createElement("span");
    name.className = "name";
    name.textContent = item.name;

    if (settings.showNames) {
    link.appendChild(name);
    }

    if (item.type === "shortcut") {
      link.href = "shortcuts://run-shortcut?name=" +
        encodeURIComponent(item.target);
    } else if (item.type === "url") {
      link.href = item.target;
    }

    menu.appendChild(link);
  });
}

// ==================================
// 管理画面
// ==================================

function showManager() {
  document.getElementById("main").style.display = "none";
  document.getElementById("manager").style.display = "block";
  renderManageList();
}

function hideManager() {
  document.getElementById("manager").style.display = "none";
  document.getElementById("main").style.display = "block";
  renderMenu();
}

function renderManageList() {
  const list = document.getElementById("manageList");
  list.innerHTML = "";

  items.forEach((item, i) => {
    const row = document.createElement("div");
    row.className = "manage-item";

    if (item.image) {
      const img = document.createElement("img");
      img.src = item.image;
      row.appendChild(img);
    } else {
      const emoji = document.createElement("div");
      emoji.className = "emoji";
      emoji.textContent = item.emoji || "📱";
      row.appendChild(emoji);
    }

    const info = document.createElement("div");
    info.className = "info";

    const title = document.createElement("strong");
    title.textContent = item.name;

    const detail = document.createElement("small");
    detail.textContent =
      item.type === "shortcut" ? "ショートカット" : "URL・アプリ";

    info.appendChild(title);
    info.appendChild(document.createElement("br"));
    info.appendChild(detail);

    const actions = document.createElement("div");
    actions.className = "actions";

    const up = document.createElement("button");
    up.textContent = "↑";
    up.disabled = i === 0;
    up.onclick = () => moveItem(i, -1);

    const down = document.createElement("button");
    down.textContent = "↓";
    down.disabled = i === items.length - 1;
    down.onclick = () => moveItem(i, 1);

    const edit = document.createElement("button");
    edit.textContent = "編集";
    edit.onclick = () => editItem(i);

    const del = document.createElement("button");
    del.textContent = "削除";
    del.className = "delete";
    del.onclick = () => deleteItem(i);

    actions.append(up, down, edit, del);
    row.append(info, actions);
    list.appendChild(row);
  });
}

// ==================================
// 追加・編集
// ==================================

function newItem() {
  editingIndex = -1;
  selectedImage = "";
  originalImage = "";

  document.getElementById("editorTitle").textContent = "新しい項目";
  document.getElementById("itemName").value = "";
  document.getElementById("itemEmoji").value = "📱";
  document.getElementById("itemType").value = "url";
  document.getElementById("itemTarget").value = "";
  document.getElementById("itemImage").value = "";

  updateTargetLabel();
  updatePreview();

  document.getElementById("editor").classList.remove("hidden");
  document.getElementById("itemName").focus();
}

function editItem(i) {
  const item = items[i];
  editingIndex = i;
  selectedImage = item.image || "";
  originalImage = item.image || "";

  document.getElementById("editorTitle").textContent = "項目を編集";
  document.getElementById("itemName").value = item.name;
  document.getElementById("itemEmoji").value = item.emoji || "📱";
  document.getElementById("itemType").value = item.type;
  document.getElementById("itemTarget").value = item.target;
  document.getElementById("itemImage").value = "";

  updateTargetLabel();
  updatePreview();

  document.getElementById("editor").classList.remove("hidden");
}

function cancelEdit() {
  document.getElementById("editor").classList.add("hidden");
}

function updateTargetLabel() {
  const type = document.getElementById("itemType").value;
  const label = document.getElementById("targetLabel");
  const input = document.getElementById("itemTarget");

  if (type === "shortcut") {
    label.textContent = "実行するショートカット名";
    input.placeholder = "例：アラーム設定";
  } else {
    label.textContent = "起動URL";
    input.placeholder = "https://example.com";
  }
}

// ==================================
// 画像処理
// ==================================

function updatePreview() {
  const preview = document.getElementById("preview");
  preview.innerHTML = "";

  if (selectedImage) {
    const img = document.createElement("img");
    img.src = selectedImage;
    preview.appendChild(img);
  } else {
    preview.textContent =
      document.getElementById("itemEmoji").value || "📱";
  }
}

document.getElementById("itemEmoji").addEventListener("input", updatePreview);

function clearImage() {
  selectedImage = "";
  document.getElementById("itemImage").value = "";
  updatePreview();
}

document.getElementById("itemImage").addEventListener("change", function() {
  const file = this.files[0];
  if (!file) return;

  if (!file.type.startsWith("image/")) {
    alert("画像ファイルを選択してください。");
    return;
  }

  const reader = new FileReader();

  reader.onload = function(event) {
    const image = new Image();

    image.onload = function() {
      const canvas = document.createElement("canvas");
      const size = 256;

      canvas.width = size;
      canvas.height = size;

      const ctx = canvas.getContext("2d");
      const scale = Math.max(size / image.width, size / image.height);
      const width = image.width * scale;
      const height = image.height * scale;

      ctx.drawImage(
        image,
        (size - width) / 2,
        (size - height) / 2,
        width,
        height
      );

      selectedImage = canvas.toDataURL("image/jpeg", 0.85);
      updatePreview();
    };

    image.src = event.target.result;
  };

  reader.readAsDataURL(file);
});

// ==================================
// 保存
// ==================================

function saveItem() {
  const name = document.getElementById("itemName").value.trim();
  const type = document.getElementById("itemType").value;
  const target = document.getElementById("itemTarget").value.trim();
  const emoji = document.getElementById("itemEmoji").value.trim() || "📱";

  if (!name || !target) {
    alert("表示名と起動先を入力してください。");
    return;
  }

  if (type === "url" &&
      !/^https?:\/\/|^shortcuts:\/\//i.test(target)) {
    alert("URLを正しく入力してください。");
    return;
  }

  const item = {
    name,
    emoji,
    image: selectedImage,
    type,
    target
  };

  if (editingIndex >= 0) {
    items[editingIndex] = item;
  } else {
    items.push(item);
  }

  if (saveData()) {
    document.getElementById("editor").classList.add("hidden");
    renderManageList();
    renderMenu();
    alert("保存しました。");
  }
}

// ==================================
// 削除・並び替え
// ==================================

function deleteItem(i) {
  if (!confirm("「" + items[i].name + "」を削除しますか？")) return;

  items.splice(i, 1);

  if (saveData()) {
    renderManageList();
    renderMenu();
  }
}

function moveItem(i, direction) {
  const next = i + direction;
  if (next < 0 || next >= items.length) return;

  [items[i], items[next]] = [items[next], items[i]];

  if (saveData()) {
    renderManageList();
    renderMenu();
  }
}

renderMenu();

</script>
</body>
</html>
